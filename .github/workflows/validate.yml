name: Validate Nabaztag Local

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Compile all Python files
        run: python -m compileall -q custom_components/nabaztag_local tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON and YAML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path("custom_components/nabaztag_local").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("JSON OK:", path)
          yaml.safe_load(Path("custom_components/nabaztag_local/services.yaml").read_text(encoding="utf-8"))
          print("Services YAML OK")
          PY
